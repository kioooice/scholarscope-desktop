name: Build Windows Portable App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-portable:
    name: Build portable ScholarScope ZIP
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for the build
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Prepare portable internal engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stageRoot = Join-Path $env:RUNNER_TEMP "scholarscope-portable-stage"
          $appDir = Join-Path $stageRoot "app"
          $runtimeDir = Join-Path $stageRoot "runtime"
          $nodeDir = Join-Path $runtimeDir "node"
          $pythonDir = Join-Path $runtimeDir "python"
          New-Item -ItemType Directory -Force -Path $appDir, $nodeDir, $pythonDir | Out-Null

          Copy-Item "apps\desktop\server.mjs" (Join-Path $appDir "server.mjs")
          Copy-Item "resources\engine" (Join-Path $appDir "engine") -Recurse

          $nodeZip = Join-Path $env:RUNNER_TEMP "node-win-x64.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.14.0/node-v24.14.0-win-x64.zip" -OutFile $nodeZip
          $nodeExtracted = Join-Path $env:RUNNER_TEMP "scholarscope-node"
          Expand-Archive -Path $nodeZip -DestinationPath $nodeExtracted -Force
          $nodeRoot = Get-ChildItem -Path $nodeExtracted -Directory | Select-Object -First 1
          if (-not $nodeRoot) { throw "Bundled Node.js folder was not found." }
          $nodeExecutable = Join-Path $nodeRoot.FullName "node.exe"
          if (-not (Test-Path -LiteralPath $nodeExecutable)) { throw "Bundled Node.js executable was not found." }
          Copy-Item $nodeExecutable (Join-Path $nodeDir "node.exe")

          $pythonZip = Join-Path $env:RUNNER_TEMP "python-embed.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -OutFile $pythonZip
          Expand-Archive -Path $pythonZip -DestinationPath $pythonDir -Force
          $pythonExe = Join-Path $pythonDir "python.exe"
          $pythonPth = Get-ChildItem -Path $pythonDir -Filter "*_pth" | Select-Object -First 1
          if (-not $pythonPth) { throw "Python embeddable path file was not found." }
          Add-Content -LiteralPath $pythonPth.FullName -Value "`nLib\site-packages`nimport site"

          $getPip = Join-Path $env:RUNNER_TEMP "get-pip.py"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile $getPip
          & $pythonExe $getPip --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw "Pip bootstrap failed." }
          & $pythonExe -m pip install --disable-pip-version-check --no-cache-dir "scansci-pdf[web]==1.9.0" "mcp<2"
          if ($LASTEXITCODE -ne 0) { throw "Python engine dependency installation failed." }
          & $pythonExe -c "import scansci_pdf, requests, mcp"
          if ($LASTEXITCODE -ne 0) { throw "Embedded Python engine verification failed." }

      - name: Build desktop EXE
        run: npm --workspace scholarscope-desktop run tauri:build -- --no-bundle --ci

      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portableDir = Join-Path $env:GITHUB_WORKSPACE "portable"
          $stageRoot = Join-Path $env:RUNNER_TEMP "scholarscope-portable-stage"
          $appStage = Join-Path $stageRoot "app"
          $runtimeStage = Join-Path $stageRoot "runtime"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null

          $desktopExe = @(
            (Join-Path $env:GITHUB_WORKSPACE "apps\desktop\src-tauri\target\release\scholarscope-desktop.exe"),
            (Join-Path $env:GITHUB_WORKSPACE "apps\desktop\src-tauri\target\release\ScholarScope.exe")
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $desktopExe) { throw "Tauri desktop executable was not found." }
          if (-not (Test-Path -LiteralPath $appStage) -or -not (Test-Path -LiteralPath $runtimeStage)) {
            throw "Portable app or runtime files were not found."
          }

          Copy-Item $desktopExe (Join-Path $portableDir "ScholarScope.exe")
          Copy-Item -LiteralPath $appStage -Destination $portableDir -Recurse
          Copy-Item -LiteralPath $runtimeStage -Destination $portableDir -Recurse

          $requiredPaths = @(
            (Join-Path $portableDir "app\server.mjs"),
            (Join-Path $portableDir "app\engine\worker.py"),
            (Join-Path $portableDir "runtime\node\node.exe"),
            (Join-Path $portableDir "runtime\python\python.exe")
          )
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Portable layout is incomplete: $path"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $portableDir "resources")) {
            throw "Legacy resources wrapper was included."
          }

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "ScholarScope-portable-win64.zip"
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $zipPath -CompressionLevel Optimal -Force

      - name: Smoke test the portable app engine
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\smoke-test-portable.ps1" -PortableExe "$env:GITHUB_WORKSPACE\portable\ScholarScope.exe"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ScholarScope-portable-win64
          path: ScholarScope-portable-win64.zip
          if-no-files-found: error
          retention-days: 30
